name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install icon renderer
        run: brew install librsvg

      - name: Run tests
        run: make test

      - name: Build app bundle
        run: make app

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ModelMoor-app
          path: .build/app/ModelMoor.app
          if-no-files-found: error